name: Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    container: nimlang/choosenim
    steps:
    - run: choosenim update -y 2.2.0
    - uses: actions/checkout@v3
    - run: git config --global --add safe.directory "$(pwd)"
    - run: nimble test
    - run: nimble readme
    - run: nim e ./src/json_schema_import.nim

  examples:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Every example is registered for testing
      run: |
        status=0
        for dir in tests/examples/*/; do
          name=$(basename "$dir")
          grep -qF "buildTest(\"$name\"," tests/defs.nim || {
            echo "::error::$name is missing from tests/defs.nim"
            status=1
          }
          grep -qF "\"examples/$name/schema.json\"" tests/import_all.nim || {
            echo "::error::$name is missing from tests/import_all.nim"
            status=1
          }
        done
        exit $status

  version:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Generated code changes bump json_schema_version
      run: |
        cache=src/json_schema_import/private/cache.nim
        hash=$(find tests -name expect.nim | sort | xargs cat | sha1sum | cut -d" " -f1)

        grep -qF "json_schema_version* = \"$hash\"" "$cache" || {
          echo "::error file=$cache::The code generation snapshots have changed, so"\
            "warm caches holding the previous output need to be invalidated. Set"\
            "json_schema_version to \"$hash\""
          exit 1
        }
